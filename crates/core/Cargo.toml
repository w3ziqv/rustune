[package]
name = "rustune-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
[dependencies]
anyhow = "1"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
zeroize = "1.9.1"
nix = { version = "0.31", features = ["user"] }
[lints.rust]
unsafe_code = "forbid"
