[package]
name = "rustune-audio"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
[features]
default = []
slim-ffmpeg = ["ffmpeg-next/static"]
[dependencies]
rustune-core = { path = "../crates/core" }
alsa = "0.12.1"
base64 = "0.23.1"
cdm-host = { path = "../vendor/cdm-host" }
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["format", "codec", "software-resampling"] }
anyhow = "1"
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt", "macros"] }
zeroize = "1.9.1"
nix = { version = "0.31", features = ["user"] }
[lints.rust]
unsafe_code = "forbid"
