name: Rust
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, '1.99.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: D-Bus integration test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus
      - run: cargo fmt --all -- --check
        if: matrix.toolchain == 'stable'
      - run: cargo clippy --locked --all-targets -- -D warnings
        if: matrix.toolchain == 'stable'
      - run: cargo test --locked
      - run: cargo build --locked --release
