[package]
name = "rustune"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "A fast, lightweight, privacy-focused Apple Music TUI for Linux, written in Rust."
license = "MIT"
repository = "https://github.com/w3ziqv/rustune"
keywords = ["apple-music", "tui", "linux", "music", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
rustune-core = { path = "crates/core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fastrand = "2"
nix = { version = "0.31", features = ["signal", "process", "fs", "user", "poll"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
httpdate = "1.0.3"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
toml = "1.2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "service", "proxy"] }
zeroize = "1.9.1"
unicode-width = "0.2.3"

[dev-dependencies]
base64 = "0.23.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.compact]
inherits = "release"
opt-level = "z"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[workspace]
members = ["crates/core", "audio"]
default-members = [".", "crates/core", "audio"]
exclude = ["vendor/cdm-host"]
resolver = "3"
